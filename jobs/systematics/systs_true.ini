# Fractional systematics in TRUE NEUTRINO ENERGY space.
#
# Pairs with systs_reco.ini. Both share `tag = systs`, so they share ONE cache
# and one hour of processing - the run directory is keyed on the tag, and
# --fit-variable needs no re-process ("all variables are already in the cached
# binaries"). Only `output` differs, so the PDFs sit side by side.
#
# WHY --fit-variable RATHER THAN plot FLAGS. Setting plot="true" on a variable
# gets you its CV plot, but the fractional systematics breakdown is emitted
# once, for i_prime only (PROfit_plot.cxx:67, hard-wired to config.i_prime with
# no loop over variables). So the space you want the breakdown in has to BE the
# fitting variable.
#
# systematics_suite.xml carries contours_base.xml's full systematics suite
# verbatim (same 126 allowlist entries, same selection), but drops the 2D
# RecoE;pn binning it has no use for. The remaining variables are ordered so
# every index-dependent attribute keeps its meaning: variable_index=1 is still
# True L/E and the 74 interaction splines are still pinned to var2 = True E.
#     var0  RecoE (1D)      reco space
#     var1  True L/E        model-reserved - CANNOT be fit, ValidateFitVariable
#                           rejects the model's own kinematic variable
#     var2  True E [GeV]    true space  <- this config
#
# Run:
#     scripts/profit_run.sh jobs/systematics/systs_reco.ini plot
#     scripts/profit_run.sh jobs/systematics/systs_true.ini plot
# The first builds the cache; the second reuses it.

xml = xml/systematics/systematics_suite.xml
tag = systs
output = trueE
nthread = 104

fit-variable = 2

verbosity = 3
progress = true
log = systs_true.log
file-verbosity = 2

scale-by-width = true

# NOTE: deliberately no `scale` here. --scale only scales per-event weights
# keyed on variable 0 (PROpeller::scale, `if(io>0) break;`), so combining it
# with a non-zero fit-variable would silently mis-scale. These are prior
# systematics plots at nominal exposure, so the question does not arise - but
# do not add --scale to this config without moving the observable to var0.
