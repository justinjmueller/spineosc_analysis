# Contours with a 1D reconstructed-energy fit variable.
#
# xml/contours/contours_recoe.xml is contours_base.xml with ccqelike fit in 1D
# RecoE rather than 2D RecoE;pn; everything else (detectors, POTs, model,
# subchannels, systematics, MC files, selections) is identical.
#
# This is the configuration the conditional-constraint study reads, because a
# 2D fit channel's covariance space cannot be reconstructed from a PROplot
# file: PROfit flattens nx*ny bins into the covariance while writing only the
# nx-bin x projection per subchannel. See the XML header.
#
# Run (process once, then plot as often as wanted):
#     scripts/profit_run.sh jobs/contours/contours_recoe.ini process
#     scripts/profit_run.sh jobs/contours/contours_recoe.ini plot --with-covar
#
# --with-covar IS REQUIRED for the constraint study: without it PROfit writes
# no Covariance directory at all, and mutools.profit has nothing to read. It is
# off by default because the matrices are slow to build and the companion PDFs
# are large.

xml = xml/contours/contours_recoe.xml
tag = contours_recoe
nthread = 104

verbosity = 3
progress = true
log = contours_recoe.log
file-verbosity = 2
