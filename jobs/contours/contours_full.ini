# Scenario 3 - FULL UNBLIND: neither detector blinded, nominal exposure,
# 2D fit.
#
# Figure 3 of the SBND data access request, third curve: "ultimate sensitivity
# with full access to both the near and far detector datasets".
#
# Uses xml/contours/contours_base.xml unmodified - it already carries no
# blinding `norm` entries and the nominal detector POTs (SBND 1e20,
# ICARUS Run 2 2e20, Run 4 3e20), so this scenario needs no derived config.
# var0 is the 2D RecoE;pn in ccqelike and 1D RecoE in nproton.
#
# No `scale` here: this is the full-exposure projection. The other two
# scenarios scale down to the development sample.
#
# Run:
#     scripts/profit_run.sh jobs/contours/contours_full.ini surface -g 30 --xlo 1e-2 --ylo 1e-1

xml = xml/contours/contours_base.xml
tag = contours_full
nthread = 104

verbosity = 3
progress = true
log = surface.log
file-verbosity = 2

# See contours_blind.ini for the caveat about verifying these took effect.
preset = good good
scan-fit-options = n_max_local_retries 3 max_linesearch 40 min_step 1e-10
