# Scenario 1 - FULLY BLIND: fit in pn only, SBND and ICARUS both shape-only.
#
# Figure 3 of the SBND data access request, first curve: "shape-only
# information in the near and far detector development samples".
#
# The observable is xml/contours/contours_pn.xml's var0, a 1D pn binning in
# both channels. It must be var0, not something chosen with --fit-variable,
# because --scale only scales per-event weights keyed on variable 0
# (PROpeller::scale, `if(io>0) break;`) - scaling while fitting a different
# variable silently mis-scales the prediction.
#
# Blinding is not a flag. Both 100% `norm` systematics are written directly
# into contours_pn.xml; a free normalization per detector discards that
# detector's rate information. The ICARUS pattern is `nu_ICARUS` WITHOUT a
# trailing underscore - the detectors are ICARUSRun2/ICARUSRun4, so
# `nu_ICARUS_` matches nothing.
#
# Run:
#     scripts/profit_run.sh jobs/contours/contours_blind.ini surface -g 30 --xlo 1e-2 --ylo 1e-1
# or batched with the other two scenarios:
#     scripts/submit_fanout.sh --queue capacity --walltime 04:00:00 \
#         jobs/contours/*.ini -- surface -g 30 --xlo 1e-2 --ylo 1e-1
#
# `surface` auto-processes when no cache exists, so the first run builds
# <tag>_prop.bin / <tag>_syst.bin and later runs reuse them.

xml = xml/contours/contours_pn.xml
tag = contours_blind
nthread = 104

verbosity = 3
progress = true
log = surface.log
file-verbosity = 2

# Vector-valued options; CLI11 config files take the values space-separated on
# one line. VERIFY ON FIRST RUN - an unrecognised or malformed key is silently
# ignored, so grep the log for `max_linesearch: 40` to confirm it took rather
# than falling back to preset defaults.
preset = good good
scan-fit-options = n_max_local_retries 3 max_linesearch 40 min_step 1e-10

# Development-sample exposure: SBND 5e18, ICARUS Run 2 2e19, Run 4 3e19,
# against nominal 1e20 / 2e20 / 3e20. Both ICARUS runs land on the same factor.
# Applied to the loaded MC, so no <detector pot> edit and no re-process.
scale = SBND 0.05 ICARUS 0.1
