# Scenario 2 - SBND UNBLIND: SBND fits 2D RecoE;pn with normalization used;
# ICARUS contributes pn only, rate-free.
#
# Figure 3 of the SBND data access request, second curve: "normalization
# information in the near detector development sample".
#
# WHY THE XML LOOKS UNUSUAL. Giving two detectors different observables needs
# different channels, but PROfit replicates every channel across every detector,
# so 4 channels x 3 detectors left 6 of 12 blocks unfilled and the job died on
#   empty_bin_check || 144 collapsed CV bins are empty. Aborting.
# (empty bins make the CNP/stat covariance singular).
#
# contours_sbnd2d.xml fixes that by collapsing the detector dimension into the
# channel names: ONE detector ("SBN") x 6 channels, every block filled.
#
#   sbndccqelike         2D RecoE;pn   48 bins
#   sbndnproton          RecoE         14 bins
#   icarusrun2ccqelike   pn            10 bins
#   icarusrun2nproton    pn            10 bins
#   icarusrun4ccqelike   pn            10 bins
#   icarusrun4nproton    pn            10 bins
#
# This is physics-neutral: mode and detector are bookkeeping labels in PROfit,
# and the oscillation baseline enters through true_baseline in the L/E
# expression, not the detector name. The three exposures are preserved with the
# per-file <MCFile scale> attribute (1.0 / 2.0 / 3.0 against the single 1e20
# target), which multiplies that file's POT weight.
#
# Blinding: ICARUS only (pattern `icarus`). SBND has no norm entry, so its
# normalization IS used - that is what distinguishes this curve from curve 1.

xml = xml/contours/contours_sbnd2d.xml
tag = contours_sbndunblind
nthread = 104

verbosity = 3
progress = true
log = surface.log
file-verbosity = 2

# See contours_blind.ini for the caveat about verifying these took effect.
preset = good good
scan-fit-options = n_max_local_retries 3 max_linesearch 40 min_step 1e-10

# Development-sample exposure: SBND 5e18, ICARUS 2e19 (Run 2) / 3e19 (Run 4).
# PATTERNS ARE LOWERCASE ON PURPOSE. With the detector folded into the channel
# names, fullnames look like nu_SBN_sbndccqelike_target - `SBND` and `ICARUS`
# would match nothing. Unlike a norm pattern, a non-matching --scale pattern is
# SILENT: you would get full nominal exposure with no warning at all.
scale = sbnd 0.05 icarus 0.1
