# Scenario 2 - SBND UNBLIND: SBND fits its full observable with normalization
# unlocked; ICARUS contributes shape only, in pn.
#
# Figure 3 of the SBND data access request, second curve: "normalization
# information in the near detector development sample".
#
# PROfit has ONE global fitting variable and binning is a property of the
# channel, so a per-detector observable needs per-detector CHANNELS. That is
# what xml/contours/contours_split.xml does:
#
#     ccqelikeS / nprotonS   filled by SBND only    var0 = 2D RecoE;pn / RecoE
#     ccqelikeI / nprotonI   filled by ICARUS only  var0 = 1D pn
#
# Every channel still replicates across every detector, so half of the 72
# subchannels are unfilled by design. PROfit supports this explicitly
# ("Subchannel ... is not filled by any <branch>; its bins will be empty"),
# but it is the untested part of this scenario: a covariance with zero-
# prediction rows could be singular. If a fit fails to converge here and not
# in the other two scenarios, that is the first thing to check.
#
# Only ICARUS carries a 100% `norm` blinding entry; SBND's rate information
# enters the fit.
#
# Run:
#     scripts/profit_run.sh jobs/contours/contours_sbndunblind.ini surface -g 30 --xlo 1e-2 --ylo 1e-1

xml = xml/contours/contours_split.xml
tag = contours_sbndunblind
nthread = 104

verbosity = 3
progress = true
log = surface.log
file-verbosity = 2

# See contours_blind.ini for the caveat about verifying these took effect.
preset = good good
scan-fit-options = n_max_local_retries 3 max_linesearch 40 min_step 1e-10

# Same development-sample exposure as scenario 1.
scale = SBND 0.05 ICARUS 0.1
