# SBND CV + error band matched to the injected parameter scan.
#
# Produces the SBND central value and its systematic error band in the same 1D
# reconstructed-energy bins, and at the same exposure, as the injected grid
# points under parameter_scan/. plotting/sbnd_data_access.ipynb reads the band
# out of this job's PROplot file and counts how many bins each injected point
# falls outside of.
#
# Run (process is the expensive step, plot is cheap and re-runnable):
#     scripts/profit_run.sh jobs/contours/sbnd_scanmatch.ini process
#     scripts/profit_run.sh jobs/contours/sbnd_scanmatch.ini plot
#
# The band lands in the output's ErrorBand/Var0 as
#     nu_SBN_sbndccqelike_preerrband   (16 bins, 0.3-1.5 GeV)
#     nu_SBN_sbndnproton_preerrband    (14 bins, 0.4-2.0 GeV)
# with fY / fEYlow / fEYhigh, alongside the matching _cv1d histograms. Var0 is
# the 1D RecoE here, so no plot-flag change is needed - unlike
# contours_sbnd2d.xml, where RecoE is var3 and flagged plot="false", leaving
# ErrorBand/Var3 empty.

xml = xml/contours/sbnd_scanmatch.xml
tag = sbnd_scanmatch
nthread = 104

verbosity = 3
progress = true
log = sbnd_scanmatch.log
file-verbosity = 2

# NO `scale` LINE ON PURPOSE. The exposure is declared directly as the
# detector POT in the XML (4.196270e+18, the collected SBND data POT the scan
# was generated at). contours_sbndunblind.ini instead carries 1e20 in its XML
# and scales by 0.05 at load time; mixing the two conventions here would scale
# an already-correct exposure. A non-matching --scale pattern is also silent,
# which is a second reason to keep the number in the XML where it is checked.
#
# NO `scale-by-width` / `area-norm` / `shapeonly` EITHER. The scan's Osc_hists
# are raw event counts per bin, and the comparison is bin-by-bin against the
# band, so the CV must stay in counts too.
[plot]