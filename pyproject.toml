[project]
name = "spineosc"
version = "1.1.0"
description = "SBND + ICARUS muon-neutrino disappearance analysis: configs, scripts and plotting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.3",
    "scipy>=1.13",
    "uproot>=5.6",
    "nbformat>=5.10",
    "toml>=0.10",
    "mutools",
]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.uv.sources]
mutools = { path = "../mutools", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reBruce", "archive", "runs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
