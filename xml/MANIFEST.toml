# XML manifest: every analysis XML (and its _plot.ini / _data.xml siblings) belongs to exactly one family below.
# The most specific (longest) matching pattern wins. Check with:  python scripts/xml_manifest.py --check
#
# status:
#   active       used whenever the technote products are regenerated; keep working and current
#   frozen       belongs to a section that is intentionally not updated (do not modify; regenerate only to reproduce)
#   reference    documentation/template, not run to make products
#   archived     superseded or finished, kept for provenance; not expected to run against current inputs
#   deprecated   development copy or abandoned; candidate for deletion once confirmed
#   needs-review classification not yet decided (owner to confirm)
# "generated = true": produced by `producer`; the generator and this entry are the source of truth, the files are reproducible.
# Fields: pattern, status, purpose, producer, consumer (script/notebook that reads the PROfit output; checked to exist), technote (sections; also the figures/<section> folder the provenance report counts), superseded_by, regenerate, notes, reviewed (YYYY-MM-DD; a *proposed* entry says so).

[[family]]
pattern = "xml/selected/*"
status = "active"
purpose = "Selected-event composition and efficiency inputs (inclusive and exclusive), v1.1.0 selection with SBND crosser and end-point cuts"
producer = "scripts/update_selected_signal_xmls.py"
consumer = "plotting/studies/signal_selection.py"
technote = "signal_and_selection"
reviewed = "2026-10-08 (proposed)"

[[family]]
pattern = "xml/signal/*"
status = "active"
purpose = "Signal-definition inputs (inclusive and exclusive), truth-level end-point cut"
producer = "scripts/update_selected_signal_xmls.py"
consumer = "plotting/studies/signal_selection.py"
technote = "signal_and_selection"
reviewed = "2026-10-08 (proposed)"

[[family]]
pattern = "xml/systematics/systematics_suite.xml"
status = "active"
purpose = "Full systematic suite (reco and true energy) with the detector ratios of detvar/detsys-v1.1.0v2.root"
producer = "scripts/systematics_suite_from_recoe.py"
consumer = "plotting/studies/systematics.py"
technote = "systematics"
reviewed = "2026-10-08 (proposed)"

[[family]]
pattern = "xml/systematics/systematics_suite_endx4.xml"
status = "deprecated"
purpose = "Development copy of the suite with the end-point cut; promoted into systematics_suite.xml"
superseded_by = "xml/systematics/systematics_suite.xml"
reviewed = "2026-10-08 (proposed)"

[[family]]
