[[family]]
pattern = "xml/resolution/*"
status = "active"
generated = false
purpose = "Resolution (bias) studies for the inclusive and exclusive selections, v1.1.0 inputs (cvrw + cvwgt, SBND crosser and end-point cuts); migrated with scripts/update_selected_signal_xmls.py:fix_selected"
regenerate = "../profit-asymmetric/build/bin/PROfit --config xml/resolution/{inclusive,exclusive}_plot.ini plot"
consumer = "plotting/studies/resolution.py"
technote = "signal_and_selection (12 resolution figures)"
