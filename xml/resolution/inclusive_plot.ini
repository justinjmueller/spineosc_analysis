# Resolution (bias) variables for the inclusive selection: var4..var9 hold the
# calorimetric and CCQE energy biases and the muon / leading-proton KE biases.
# Consolidated here so xml/selected/ stays a plain selection-composition config.
#
# No scale-by-width: these axes are dimensionless bias, so the bin contents are
# plain event counts.
#
# Run from the repository root so the XML's relative work/ paths resolve:
#   ../profit-asymmetric/build/bin/PROfit --config xml/resolution/inclusive_plot.ini plot
xml = xml/resolution/inclusive.xml
tag = resolution_inclusive
nthread = 4

[plot]
