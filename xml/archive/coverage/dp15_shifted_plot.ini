# Delta-p coverage at 15 bins (66.7 MeV/c), CV SHIFTED by +1 sigma.
# The 15-bin counterpart of dp_shifted_plot.ini; see that file for the details of
# the injection. Both 15-bin configs share `tag`, so the vanilla run builds the
# cache and the shifted one reuses it. The binning lives in the XML, so this
# pair needs its own cache, separate from the 10-bin one.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/coverage/dp15_shifted_plot.ini plot
xml = xml/coverage/dp15.xml
tag = dp15_test09242026
data = xml/coverage/dp15_data.xml
output = shifted
scale-by-width = true
#shapeonly = true
area-norm = true
nthread = 4

inject-systs-cv = ZExpPCAWeighter_SBN_v3_MvA_b1 1 ZExpPCAWeighter_SBN_v3_MvA_b2 1 ZExpPCAWeighter_SBN_v3_MvA_b3 1 ZExpPCAWeighter_SBN_v3_MvA_b4 1 GENIEReWeight_SBN_v1_multisigma_FrPiProd_pi 1

[plot]
with-covar = true
