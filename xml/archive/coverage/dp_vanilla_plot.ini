# Delta-p coverage, UNSHIFTED CV. Pairs with dp_shifted_plot.ini: identical in
# every respect except that the other injects a +1 sigma CV shift, so the two
# data/MC plots differ only by the injection.
#
# Both share `tag`, hence one cache and one round of processing: the injection
# is applied at plot time from the cached splines, so only `output` and
# `inject-systs-cv` differ. Run this one first to build the cache.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/coverage/dp_vanilla_plot.ini plot
xml = xml/coverage/dp.xml
tag = dp_test09242026
data = xml/coverage/dp_data.xml
output = vanilla
scale-by-width = true
#shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
