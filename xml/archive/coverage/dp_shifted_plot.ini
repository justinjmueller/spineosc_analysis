# Delta-p coverage, CV SHIFTED by +1 sigma on the cross-section knobs discussed
# on Slack. Pairs with dp_vanilla_plot.ini, which must run first to build the
# shared cache (same `tag`).
#
# --inject-systs-cv takes name/sigma PAIRS, so each knob carries its own shift;
# it is not a list. Names match the XML's allowlist entries (matching also
# accepts the plotname), and only spline systematics can be injected -- all
# five below are splines in dp.xml. They stay in the allowlist, so each remains
# a free nuisance parameter; the injection moves where its CV sits, nothing is
# fixed and nothing is double counted.
#
# CCQEXSecCorr_SBN_v3_CCQEXSecCorr from the Slack thread is deliberately absent:
# no such branch exists in these ntuples (the CCQE-related ones are
# GENIEReWeight_SBN_v1_multisigma_ZExpA{1..4}CCQE and VecFFCCQEshape).
#
# NOTE the weights are NOT multiplied into additional_weight in the XML. Doing
# both would apply each weight twice, once in the CV and once through the
# spline knots.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/coverage/dp_shifted_plot.ini plot
xml = xml/coverage/dp.xml
tag = dp_test09242026
data = xml/coverage/dp_data.xml
output = shifted
scale-by-width = true
#shapeonly = true
area-norm = true
nthread = 4

inject-systs-cv = ZExpPCAWeighter_SBN_v3_MvA_b1 1 ZExpPCAWeighter_SBN_v3_MvA_b2 1 ZExpPCAWeighter_SBN_v3_MvA_b3 1 ZExpPCAWeighter_SBN_v3_MvA_b4 1 GENIEReWeight_SBN_v1_multisigma_FrPiProd_pi 1

[plot]
with-covar = true
