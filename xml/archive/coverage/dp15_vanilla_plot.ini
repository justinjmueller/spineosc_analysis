# Delta-p coverage at 15 bins (66.7 MeV/c), UNSHIFTED CV.
# The 15-bin counterpart of dp_vanilla_plot.ini; see that file for the details of
# the injection. Both 15-bin configs share `tag`, so the vanilla run builds the
# cache and the shifted one reuses it. The binning lives in the XML, so this
# pair needs its own cache, separate from the 10-bin one.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/coverage/dp15_vanilla_plot.ini plot
xml = xml/coverage/dp15.xml
tag = dp15_test09242026
data = xml/coverage/dp15_data.xml
output = vanilla
scale-by-width = true
#shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
