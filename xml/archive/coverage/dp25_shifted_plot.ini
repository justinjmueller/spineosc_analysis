# Delta-p coverage at 25 bins (40 MeV/c), CV SHIFTED by +1 sigma.
# The 25-bin counterpart of dp_shifted_plot.ini; see that file for the injection
# details. Vanilla builds the shared cache, shifted reuses it.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/coverage/dp25_shifted_plot.ini plot
xml = xml/coverage/dp25.xml
tag = dp25_test09242026
data = xml/coverage/dp25_data.xml
output = shifted
scale-by-width = true
#shapeonly = true
area-norm = true
nthread = 4

inject-systs-cv = ZExpPCAWeighter_SBN_v3_MvA_b1 1 ZExpPCAWeighter_SBN_v3_MvA_b2 1 ZExpPCAWeighter_SBN_v3_MvA_b3 1 ZExpPCAWeighter_SBN_v3_MvA_b4 1 GENIEReWeight_SBN_v1_multisigma_FrPiProd_pi 1

[plot]
with-covar = true
