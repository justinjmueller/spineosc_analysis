# phase1-tier2: muon_p, SBND only, VANILLA (no CV injection).
# Pairs with muon_p_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier2/muon_p_cvrw.xml
tag = t2_muon_p_cvrw
data = xml/sbnd_data_access/phase1-tier2/muon_p_data.xml
output = cvrw
# CV-REWEIGHTED. Reads the reweighted v1.1.0 copy: ZExpPCA renormalised to
# 1 at zero sigma, its CV carried by cvwgt instead. Shape-only + area-norm,
# vanilla arm.
scale-by-width = true
shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
