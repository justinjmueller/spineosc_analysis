# phase1-tier1: proton_ke, SBND only, VANILLA (no CV injection).
# Pairs with proton_ke_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier1/proton_ke_cvrw.xml
tag = t1_proton_ke_cvrw
data = xml/sbnd_data_access/phase1-tier1/proton_ke_data.xml
output = cvrw_phase2
# PHASE 2: shape + normalisation. Neither shapeonly nor area-norm, so the
# prediction keeps its absolute rate and ndf is nbins, not nbins minus one.
# Same tag as the phase-1 cvrw run, so this reuses that cache: neither flag
# is part of the cache hash, only the XML is.
scale-by-width = true
nthread = 4

[plot]
with-covar = true
