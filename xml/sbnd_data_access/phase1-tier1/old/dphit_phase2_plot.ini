# phase1-tier1: dphit, SBND only, shifted (+1 sigma CV injection) arm.
# Covariances on var0; splines on var0 EXCEPT the four ZExpPCA MvA
# components, which are on var2 (see the XML for why). MattModYZ
# in place of WireModYZ.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/sbnd_data_access/phase1-tier1/dphit_shifted_plot.ini plot
xml = xml/sbnd_data_access/phase1-tier1/dphit.xml
tag = t1_dphit
data = xml/sbnd_data_access/phase1-tier1/dphit_data.xml
output = phase2
# NORMALISATION: phase 2. Neither shapeonly nor area-norm, so the comparison
# is absolutely normalised and ndf is nbins rather than nbins minus one.
scale-by-width = true
nthread = 4

inject-systs-cv = ZExpPCAWeighter_SBN_v3_MvA_b1 1 ZExpPCAWeighter_SBN_v3_MvA_b2 1 ZExpPCAWeighter_SBN_v3_MvA_b3 1 ZExpPCAWeighter_SBN_v3_MvA_b4 1 GENIEReWeight_SBN_v1_multisigma_FrPiProd_pi 1

[plot]
with-covar = true
