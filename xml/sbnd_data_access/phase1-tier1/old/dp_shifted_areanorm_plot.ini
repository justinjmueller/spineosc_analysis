# phase1-tier1: dp, SBND only, shifted (+1 sigma CV injection) arm.
# Splines and covariances on var0; MattModYZ in place of WireModYZ.
#
#   ../profit-asymmetric/build/bin/PROfit --config xml/sbnd_data_access/phase1-tier1/dp_shifted_plot.ini plot
xml = xml/sbnd_data_access/phase1-tier1/dp.xml
tag = t1_dp
data = xml/sbnd_data_access/phase1-tier1/dp_data.xml
output = shifted_areanorm
# NORMALISATION: area-norm only; the shape-only switch is deliberately absent.
# This is the PLOTTING companion to the phase-1 run. CV and data shapes are
# identical to it; what differs is the uncertainty band, which here keeps its
# normalisation component and so reflects the full systematic size rather than
# the projected remnant.
# CAUTION: the chi2 in these files is the area-normalised chi2, NOT the
# shape-only one. Do not label it as a shape chi2 on a plot.
scale-by-width = true
area-norm = true
nthread = 4

inject-systs-cv = ZExpPCAWeighter_SBN_v3_MvA_b1 1 ZExpPCAWeighter_SBN_v3_MvA_b2 1 ZExpPCAWeighter_SBN_v3_MvA_b3 1 ZExpPCAWeighter_SBN_v3_MvA_b4 1 GENIEReWeight_SBN_v1_multisigma_FrPiProd_pi 1

[plot]
with-covar = true
