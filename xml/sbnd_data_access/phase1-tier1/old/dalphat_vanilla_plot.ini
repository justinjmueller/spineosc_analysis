# phase1-tier1: dalphat, SBND only, VANILLA (no CV injection).
# Pairs with dalphat_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier1/dalphat.xml
tag = t1_dalphat
data = xml/sbnd_data_access/phase1-tier1/dalphat_data.xml
output = vanilla
# NORMALISATION: shape-only AND area-norm are both on. shapeonly rescales the
# prediction onto the data integral per channel before the chi2 and projects
# every systematic onto per-channel shape; it also implies area-norm for the
# plots, but area-norm alone does NOT imply it. Phase 2 disables both.
scale-by-width = true
shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
