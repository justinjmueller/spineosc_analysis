# phase1-tier1: dp, SBND only, VANILLA (no CV injection).
# Pairs with dp_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier1/dp.xml
tag = t1_dp
data = xml/sbnd_data_access/phase1-tier1/dp_data.xml
output = phase2_vanilla
# NORMALISATION: phase 2, vanilla arm. Neither shapeonly nor area-norm, so
# this is absolutely normalised. Companion to dp_phase2_plot.ini (shifted),
# so the pair isolates what the +1 sigma CV injection does to the rate.
scale-by-width = true
nthread = 4

[plot]
with-covar = true
