# phase1-tier1: dp, SBND only, VANILLA (no CV injection).
# Pairs with dp_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier1/dp_cvrw.xml
tag = t1_dp_cvrw
data = xml/sbnd_data_access/phase1-tier1/dp_data.xml
output = cvrw
# CV-REWEIGHTED TEST. Reads the reweighted v1.1.0 copy, where the four
# ZExpPCA components are renormalised to 1 at zero sigma and their CV
# factor is carried by the cvwgt column instead. Shape-only + area-norm,
# vanilla arm (no injection), so it compares directly against t1_dp_vanilla.
scale-by-width = true
shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
