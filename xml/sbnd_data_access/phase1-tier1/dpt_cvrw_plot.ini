# phase1-tier1: dpt, SBND only, VANILLA (no CV injection).
# Pairs with dpt_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier1/dpt_cvrw.xml
tag = t1_dpt_cvrw
data = xml/sbnd_data_access/phase1-tier1/dpt_data.xml
output = cvrw
# CV-REWEIGHTED. Reads the reweighted v1.1.0 copy: ZExpPCA renormalised to
# 1 at zero sigma, its CV carried by cvwgt instead. Shape-only + area-norm,
# vanilla arm, so it compares directly against t1_<var>_vanilla.
scale-by-width = true
shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
