# phase1-tier3: energy_qel, SBND only, VANILLA (no CV injection).
# Pairs with energy_qel_shifted_plot.ini, identical but for the +1 sigma
# inject-systs-cv line, so the two differ only by the injection.
xml = xml/sbnd_data_access/phase1-tier3/energy_qel_cvrw.xml
tag = t3_energy_qel_cvrw
data = xml/sbnd_data_access/phase1-tier3/energy_qel_data.xml
output = cvrw
# CV-REWEIGHTED. Reads the reweighted v1.1.0 copy: ZExpPCA renormalised to
# 1 at zero sigma, its CV carried by cvwgt instead. Shape-only + area-norm,
# vanilla arm.
scale-by-width = true
shapeonly = true
area-norm = true
nthread = 4

[plot]
with-covar = true
