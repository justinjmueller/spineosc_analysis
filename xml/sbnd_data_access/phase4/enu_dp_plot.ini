# phase4: joint (E_nu, delta p) configuration for the Step 4 conditional
# constraint study.
#
# Four channels in one config so PROfit's collapsed covariance spans BOTH
# observables; the cross-block is what the constraint conditions on. Order is
# E_nu first then delta p, so the blocks are contiguous:
#   bins  0:30  E_nu    (ccqelike_enu 16, nproton_enu 14)
#   bins 30:60  delta p (ccqelike_dp  20, nproton_dp  10)
#
# ABSOLUTE NORMALISATION: neither shapeonly nor area-norm. Step 4 follows
# Step 2, and conditioning on a shape-only covariance would throw away the
# normalisation information a near-detector measurement constrains best.
#
# Detector systematics use xvar="var3" (reco_visible_energy) rather than var0.
# var0 differs between the two halves, so a var0 lookup would need one ratio
# file per observable, which PROfit can only express as two SEPARATE
# systematics -- giving them zero correlation across the blocks and gutting
# the very cross-term this study measures. var3 is reco_visible_energy in
# both halves, so one ratio file gives each event a single detector weight
# that is shared by its E_nu and delta-p entries. The cost is that the
# delta-p half carries an energy-binned rather than delta-p-binned detector
# ratio.
xml = xml/sbnd_data_access/phase4/enu_dp.xml
tag = p4_enu_dp
data = xml/sbnd_data_access/phase4/enu_dp_data.xml
output = joint
scale-by-width = true
nthread = 4

[plot]
with-covar = true
