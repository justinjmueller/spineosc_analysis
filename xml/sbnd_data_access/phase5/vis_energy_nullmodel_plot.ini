# phase5: null-hypothesis (no oscillation) global fit, reconstructed neutrino
# energy, SBND.
#
# Step 5 of the data access request: fit the null to the near-detector data with
# the full uncertainty model and inspect how hard the systematic pull terms have
# to work. A good chi2 bought with strongly pulled nuisances is the failure mode
# this step exists to find.
#
# Run as:
#   PROfit --config <this> global      (no --fix needed: the model has no
#                                       physics parameters at all)
# --fix pins both physics parameters at their CV. The model's own defaults are
# already effectively no-oscillation (sinsq2thmm = 1e-10), so fixing them leaves
# the systematics as the only free parameters.
#
# ABSOLUTE NORMALISATION: neither shapeonly nor area-norm. The null fit has to
# see the rate; a shape-only fit cannot be pulled by a normalisation discrepancy
# and would hide exactly what we are looking for.
#
# Reads the CV-reweighted inputs. Fitting the pre-reweight CV would be actively
# misleading here: that central value was wrong by a factor 1.44 in rate with a
# shape tilt, and the fit would pull systematics hard to absorb an error we
# already know about, manufacturing the pathology this step tests for.
xml = xml/sbnd_data_access/phase5/vis_energy_null.xml
tag = p5_vis_energy_null
data = xml/sbnd_data_access/phase1-tier3/vis_energy_data.xml
output = null
scale-by-width = true
nthread = 4
