# Selection-level composition, inclusive channel (at least one reconstructed
# proton). Companion to xml/selected/exclusive.xml, and the selection-level
# counterpart of xml/signal/inclusive_plot.ini.
#
# The only systematic configured in the XML is mcstat and every branch sets
# incl_systematics="false", so neither area normalization nor a shape-only
# declaration is used -- the absolute POT-scaled yields are the point.
#
# Run from the repository root so the XML's relative work/ paths resolve:
#   ../profit-asymmetric/build/bin/PROfit --config xml/selected/inclusive_plot.ini plot
#
# Note: PROfit ignores unrecognized config keys (CLI11 allow_config_extras
# defaults to "ignore" and PROfit_cli.cxx:312 does not override it), so a
# misspelled key here fails silently rather than erroring. Every key below was
# checked against `PROfit --help`. The "label" key used by the coverage inis is
# deliberately absent -- no such option exists, so it never did anything.
xml = xml/selected/inclusive.xml
tag = selected_inclusive
scale-by-width = true
nthread = 4
force = true

[plot]