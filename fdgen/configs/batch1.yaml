# Batch 1: blind datasets (2D analysis). WORKING COPY - edit freely.
#
# PRIVATE: this file says which dataset is which scenario. Never share it, KEY.yaml or anything in `keydir`.
# Share only the files in `outdir`: dataset_NN_{sbnd,icarus_run2,icarus_run4}.root and dataset_NN.xml (reco variables only, selection applied).
#
# Run:   PYTHONPATH=$(root-config --libdir) .venv/bin/python -m fdgen.generate fdgen/configs/batch1.yaml     (~5 min; --dry-run prints expected yields only)
# Edit:  - `scenarios`: the physics. oscillation = {dmsq [eV^2], sinsq2thmm} (PROfit's linear units, PROfit's recipe);
#          effects = dials, each {source: standard|rebruce, dial: <branch>, sigma: <value in [0,1] for the reBruce two-knot dials>};
#          `project_true_e: true` on a scenario makes dial effects functions of true energy only, like PROfit's own --inject-systs.
#        - `exports`: one entry per dataset: name, scenario id, Poisson seed. Reorder/rename/reassign as you like (the file names are what the analyst sees).
#        - `export_defaults`: what every export writes. `keep` = the only branches in the files; `cuts` = the reco-only selection per MC tree, taken from the
#          XML (python -m fdgen.export --suggest-cuts xml/contours/contours_base.xml); a thrown event failing its cut is an error.
#        - `write_slim: true` additionally writes the known-truth weight files (they carry true_* and the injection weights: NOT blind) into `outdir`; keep that off here.
dataset:
  name: batch1
  mc_xml: xml/contours/contours_base.xml
  base_dir: runs/fakedata_data
  outdir: output/fdgen/batch1
  keydir: output/fdgen/batch1_private
  seed: 31
  write_slim: false
  shuffle: false
  rebruce_files:
    events/sbnd_large: output/sbnd_run1_fakedata_slim.root
    events/icarus_run2: output/icarus_run2_fakedata_slim.root
    events/icarus_run4: output/icarus_run4_fakedata_slim.root

scenarios:
- {id: 'null'}      # no signal
- id: O1      # low dm2: ICARUS-driven
  oscillation: {dmsq: 0.5, sinsq2thmm: 0.3}
- id: O2      # marginal, near the sensitivity edge
  oscillation: {dmsq: 1.5, sinsq2thmm: 0.05}
- id: O3      # IceCube point 1
  oscillation: {dmsq: 2.07, sinsq2thmm: 0.116}
- id: O4      # IceCube point 3
  oscillation: {dmsq: 3.5, sinsq2thmm: 0.16}
- id: O5      # IceCube point 4
  oscillation: {dmsq: 12.1, sinsq2thmm: 0.187}
- id: O6      # large amplitude
  oscillation: {dmsq: 5.0, sinsq2thmm: 0.4}
- id: O7      # high dm2 (stay below ~30 eV^2: PROfit evaluates P at L/E-bin midpoints)
  oscillation: {dmsq: 25.0, sinsq2thmm: 0.1}
- id: O8      # closure point
  oscillation: {dmsq: 2.0, sinsq2thmm: 0.2}
- id: C2      # flux horn nightmare + low-Q2 pi enhancement (pre-FSI)
  effects:
  - {source: rebruce, dial: multisigma_fdwgt_flux_horn_nightmare, sigma: 1.0}
  - {source: rebruce, dial: multisigma_fdwgt_jaesung_lowq2_pi_enhancement_prefsi, sigma: 1.0}
- id: C4      # hadron production + 0.5 x QE z-exp -> LQCD (common-mode control)
  effects:
  - {source: rebruce, dial: multisigma_fdwgt_flux_hadprod_sw_piplus_u387, sigma: 1.0}
  - {source: rebruce, dial: multisigma_fdwgt_qe_zexp_mva_to_lqcd, sigma: 0.5}
- id: C5      # flux horn nightmare + oscillation O3
  oscillation: {dmsq: 2.07, sinsq2thmm: 0.116}
  effects:
  - {source: rebruce, dial: multisigma_fdwgt_flux_horn_nightmare, sigma: 1.0}
- id: C2osc      # C2 + oscillation (3.5, 0.16)
  oscillation: {dmsq: 3.5, sinsq2thmm: 0.16}
  effects:
  - {source: rebruce, dial: multisigma_fdwgt_flux_horn_nightmare, sigma: 1.0}
  - {source: rebruce, dial: multisigma_fdwgt_jaesung_lowq2_pi_enhancement_prefsi, sigma: 1.0}

export_defaults:
  keep: [reco_visible_energy, reco_pn, reco_proton_multiplicity]
  jitter_duplicates: 1.0e-6      # an MC event thrown k>1 times would give k identical rows; the repeats get a relative 1e-6 jitter (0 = off)
  detectors:
    SBND:
      file: '{name}_sbnd.root'
      tree: events/sbnd_bnblight/selected
      cuts:
        events/sbnd_large/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/sbnd_dirt/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/sbnd_offbeam/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4)
        events/sbnd_large/selected_nonmatched: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
    ICARUSRun2:
      file: '{name}_icarus_run2.root'
      tree: events/icarus_bnblight_run2/selected
      cuts:
        events/icarus_run2/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1) && (0.615 * event_largest_flash_pe > 6000)
        events/icarus_dirt_run2/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1) && (0.615 * event_largest_flash_pe > 6000)
        events/icarus_offbeam_run2/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1)
        events/icarus_run2/selected_nonmatched: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1) && (0.615 * event_largest_flash_pe > 6000)
    ICARUSRun4:
      file: '{name}_icarus_run4.root'
      tree: events/icarus_bnblight_run4/selected
      cuts:
        events/icarus_run4/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/icarus_dirt_run4/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/icarus_offbeam_run4/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1)
        events/icarus_run4/selected_nonmatched: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))

exports:        # dataset -> scenario assignment (shuffled with a fixed seed; edit to taste)
  - {name: dataset_01, scenario: C4, seed: 1001}
  - {name: dataset_02, scenario: O2, seed: 1002}
  - {name: dataset_03, scenario: C2, seed: 1003}
  - {name: dataset_04, scenario: C2osc, seed: 1004}
  - {name: dataset_05, scenario: O3, seed: 1005}
  - {name: dataset_06, scenario: O5, seed: 1006}
  - {name: dataset_07, scenario: 'null', seed: 1007}
  - {name: dataset_08, scenario: O1, seed: 1008}
  - {name: dataset_09, scenario: O7, seed: 1009}
  - {name: dataset_10, scenario: C5, seed: 1010}
  - {name: dataset_11, scenario: O8, seed: 1011}
  - {name: dataset_12, scenario: O4, seed: 1012}
  - {name: dataset_13, scenario: O6, seed: 1013}
