# Asimov export test: weighted-expectation exports (asimov: true) of three scenarios, to check them against the CV and PROfit.
dataset:
  name: asimov_test
  mc_xml: xml/contours/contours_base.xml
  base_dir: runs/fakedata_data
  outdir: output/fdgen/asimov_test
  keydir: output/fdgen/asimov_test_private
  seed: 31
  write_slim: false
  shuffle: false
  rebruce_files:
    events/sbnd_large: output/sbnd_run1_fakedata_slim.root
    events/icarus_run2: output/icarus_run2_fakedata_slim.root
    events/icarus_run4: output/icarus_run4_fakedata_slim.root
scenarios:
- id: 'null'
- id: O8
  oscillation:
    dmsq: 2.0
    sinsq2thmm: 0.2
- id: C2
  effects:
  - source: rebruce
    dial: multisigma_fdwgt_flux_horn_nightmare
    sigma: 1.0
  - source: rebruce
    dial: multisigma_fdwgt_jaesung_lowq2_pi_enhancement_prefsi
    sigma: 1.0
export_defaults:
  keep:
  - reco_visible_energy
  - reco_pn
  - reco_proton_multiplicity
  jitter_duplicates: 1.0e-06
  detectors:
    SBND:
      file: '{name}_sbnd.root'
      tree: events/sbnd_bnblight/selected
      cuts:
        events/sbnd_large/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/sbnd_dirt/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/sbnd_offbeam/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4)
        events/sbnd_large/selected_nonmatched: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_cathode_crosser == 0) && (abs(reco_leading_muon_end_x) >= 4) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
    ICARUSRun2:
      file: '{name}_icarus_run2.root'
      tree: events/icarus_bnblight_run2/selected
      cuts:
        events/icarus_run2/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1) && (0.615 * event_largest_flash_pe > 6000)
        events/icarus_dirt_run2/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1) && (0.615 * event_largest_flash_pe > 6000)
        events/icarus_offbeam_run2/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1)
        events/icarus_run2/selected_nonmatched: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && (reco_user_containment_cut_filterEE == 1) && (0.615 * event_largest_flash_pe > 6000)
    ICARUSRun4:
      file: '{name}_icarus_run4.root'
      tree: events/icarus_bnblight_run4/selected
      cuts:
        events/icarus_run4/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/icarus_dirt_run4/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
        events/icarus_offbeam_run4/selected: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1)
        events/icarus_run4/selected_nonmatched: (reco_fiducialize_cathode == 1) && (reco_veto_sbnd_highy_highz == 1) && ((true_detector == 1 && (0.647 * event_largest_flash_pe > 2000)) || (true_detector == 2 && Run <= 10097 && (0.615 * event_largest_flash_pe > 6000)) || (true_detector == 2 && Run >= 12965 && (0.361 * event_largest_flash_pe > 3000)))
exports:
- name: asimov_null
  scenario: 'null'
  seed: 1
  asimov: true
- name: asimov_O8
  scenario: O8
  seed: 1
  asimov: true
- name: asimov_C2
  scenario: C2
  seed: 1
  asimov: true
